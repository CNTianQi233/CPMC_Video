<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パーフェクトさんすう教室 MV</title>
    <style>
      @font-face {
        font-family: 'MV JP';
        font-weight: 700;
        src: url('assets/fonts/ZenMaruGothic-Bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'MV JP';
        font-weight: 900;
        src: url('assets/fonts/ZenMaruGothic-Black.woff2') format('woff2');
      }
      @font-face {
        font-family: 'MV CN';
        src: url('assets/fonts/ZCOOLKuaiLe-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'MV Display';
        src: url('assets/fonts/DelaGothicOne-Regular.woff2') format('woff2');
      }
      :root {
        --bg: #050914;
        --fg: #eaf8ff;
        --accent: #7fdcff;
        --panel: rgba(8, 20, 56, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'MV JP', 'Zen Maru Gothic', sans-serif;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        width: min(100vw, 177.78vh);
        height: min(56.25vw, 100vh);
        display: block;
        background: #000;
      }
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #1f5fd1 0%, #0c1f4f 60%, #050914 100%);
        cursor: pointer;
        text-align: center;
        padding: 16px;
      }
      #start h1 {
        font-weight: 900;
        font-size: clamp(28px, 6vw, 72px);
        margin: 0 0 12px;
        text-shadow: 0 4px 0 #0c1f4f;
      }
      #start p {
        margin: 0 0 28px;
        opacity: 0.8;
      }
      #start button {
        font: inherit;
        font-weight: 900;
        font-size: 24px;
        padding: 14px 40px;
        border-radius: 999px;
        border: 4px solid #fff;
        background: var(--accent);
        color: #0c1f4f;
        cursor: pointer;
      }
      #start.loading button {
        opacity: 0.5;
        pointer-events: none;
      }
      #controls {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        transition: opacity 0.3s;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #controls button {
        font: inherit;
        font-weight: 700;
        min-width: 44px;
        height: 36px;
        border-radius: 10px;
        border: 0;
        background: rgba(255, 255, 255, 0.15);
        color: var(--fg);
        cursor: pointer;
      }
      #seek {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
      }
      #time {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        white-space: nowrap;
      }
      body.render #start,
      body.render #controls {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="mv" width="1920" height="1080"></canvas></div>
    <div id="start" class="loading">
      <div>
        <h1 id="title">パーフェクトさんすう教室</h1>
        <p id="status">読み込み中…</p>
        <button id="play" type="button">▶ 再生</button>
      </div>
    </div>
    <div id="controls" class="hidden">
      <button id="toggle" type="button" aria-label="再生/停止">⏸</button>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="シーク" />
      <span id="time">0:00 / 0:00</span>
      <button id="full" type="button" aria-label="全画面">⛶</button>
    </div>
    <audio id="audio" src="assets/song.mp3" preload="auto"></audio>
    <script type="module" src="src/player.js"></script>
  </body>
</html>
